name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend typecheck
        run: npx prisma generate && npx tsc -p tsconfig.json --noEmit

      - name: Frontend typecheck
        run: pnpm run typecheck:web

      - name: Backend tests
        run: pnpm run test

      - name: Frontend tests
        run: pnpm run test:frontend

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on any newly-introduced HIGH or CRITICAL vulnerability
      # in a direct or transitive dependency - the concrete SOC2 gap this
      # closes ("no dependency vulnerability scanning" from the gap analysis).
      # Moderate/low findings are reported but don't block, since blocking on
      # every low-severity advisory would make this noisy enough to get
      # ignored or disabled outright.
      - name: pnpm audit (high/critical)
        run: pnpm audit --audit-level high

      # License compliance (NFR-056/163) - fails the build if any dependency
      # carries a license outside this allowlist of commercially-clean OSS
      # licenses. Excludes this project's own root package (which has no
      # published "license" field and would otherwise be flagged as
      # UNLICENSED against itself, a false positive, not a real dependency
      # license issue).
      - name: License compliance check
        run: npx license-checker-rseidelsohn --onlyAllow "MIT;ISC;Apache-2.0;BSD-3-Clause;BSD-2-Clause;BlueOak-1.0.0;MIT-0;MPL-2.0;CC0-1.0;CC-BY-4.0;CC-BY-3.0" --excludePackages "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"

      # SBOM (CycloneDX) generated at every push, published as a build
      # artifact - closes NFR-177. --ignore-npm-errors is required because
      # this repo uses pnpm (pnpm-lock.yaml), not npm; cyclonedx-npm's
      # underlying `npm ls` reports the peer/dev dependencies of *other
      # packages'* optional dev tooling as "missing" (they were never
      # installed by pnpm and aren't part of this project's own dependency
      # tree) - those warnings don't affect the accuracy of the generated SBOM
      # for packages actually shipped in this app.
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build-only validation (no push, no registry credentials involved) -
      # catches a broken Dockerfile/build stage on every PR. Image builds
      # that actually deploy remain manual `gcloud builds submit` runs today
      # (see docs/container-image-signing.md) - this step only proves the
      # image still builds, it does not publish or sign anything.
      - name: Build image (validation only, not pushed)
        run: docker build -t ist-triage-ci-build-check:${{ github.sha }} .
