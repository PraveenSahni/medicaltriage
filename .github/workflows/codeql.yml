name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan even without a code change, to catch newly-disclosed
    # query/rule updates against unchanged code.
    - cron: "0 5 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # upload: false - this repo's plan doesn't have GitHub Advanced
      # Security/code-scanning UI enabled (confirmed: the upload step fails
      # with "Code scanning is not enabled for this repository... requires
      # GitHub Pro"). The scan itself still runs for real; results are
      # saved as a downloadable build artifact instead of the (unavailable)
      # Security tab UI.
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results

      - uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-results
          path: sarif-results
          retention-days: 90
