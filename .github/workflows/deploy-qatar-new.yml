name: Deploy (ist-triage-qatar-new)

# Builds the container image, applies Prisma migrations, and deploys all
# three Cloud Run services (ist-triage-simulation, ist-triage-demo,
# ist-triage-soc2) in the ist-triage-qatar-new GCP project on every push to
# main that passes CI. Authenticates keylessly via Workload Identity
# Federation - no JSON service account key is stored in GitHub.
#
# One-time setup required before this workflow can run (see
# docs/operations/qatar-new-cd-setup.md): create the Workload Identity Pool/
# Provider and the ci-deployer service account with exactly the roles listed
# there, then set the GCP_WORKLOAD_IDENTITY_PROVIDER repository variable.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for keyless WIF auth

concurrency:
  group: deploy-qatar-new
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  GCP_PROJECT: ist-triage-qatar-new
  GCP_REGION: me-central1
  IMAGE: me-central1-docker.pkg.dev/ist-triage-qatar-new/ist-triage-repo/ist-triage
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ci-deployer@ist-triage-qatar-new.iam.gserviceaccount.com

jobs:
  # Re-runs the same checks as CI as a hard gate - this job never runs a
  # deploy against code that hasn't been verified in this exact workflow run
  # (a merge to main having passed CI earlier is not treated as sufficient).
  verify:
    name: Typecheck and test (deploy gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: triage_test
          POSTGRES_PASSWORD: triage_test_password
          POSTGRES_DB: ist_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage_test -d ist_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://triage_test:triage_test_password@127.0.0.1:5432/ist_triage_test?schema=public
      AUDIT_DATABASE_URL: postgresql://triage_test:triage_test_password@127.0.0.1:5432/ist_triage_test?schema=public
      AUDIT_HMAC_SECRET: ci-only-audit-hmac-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate && npx tsc -p tsconfig.json --noEmit
      - run: pnpm run typecheck:web
      - run: pnpm run test:db:guard && pnpm exec prisma migrate deploy
      - run: pnpm run test
      - run: pnpm run test:frontend

  build-and-push:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker me-central1-docker.pkg.dev --quiet

      - name: Build image
        id: build
        run: |
          docker build \
            --build-arg SOURCE_GIT_SHA="${{ github.sha }}" \
            --build-arg SOURCE_BUILD_ID="${{ github.run_id }}" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.IMAGE }}:latest" \
            .
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.IMAGE }}:${{ github.sha }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  migrate:
    name: Apply Prisma migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run migration as a one-off Cloud Run Job
        run: |
          gcloud run jobs update prisma-migrate \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --service-account=ist-triage-cloudrun-sa@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-cloudsql-instances=${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:ist-triage-postgres \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest" \
            --command="npx" \
            --args="--yes,prisma@5.22.0,migrate,deploy" \
            --memory=1Gi --cpu=1 --max-retries=0 --task-timeout=600 \
            || gcloud run jobs create prisma-migrate \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --service-account=ist-triage-cloudrun-sa@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-cloudsql-instances=${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:ist-triage-postgres \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest" \
            --command="npx" \
            --args="--yes,prisma@5.22.0,migrate,deploy" \
            --memory=1Gi --cpu=1 --max-retries=0 --task-timeout=600
          gcloud run jobs execute prisma-migrate --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" --wait

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ist-triage-simulation, ist-triage-demo, ist-triage-soc2]
    steps:
      - name: Authenticate to GCP (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy revision (image update only - env/secrets managed by Terraform)
        run: |
          gcloud run deploy "${{ matrix.service }}" \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}"

      - name: Smoke-check runtime environment endpoint
        run: |
          url=$(gcloud run services describe "${{ matrix.service }}" --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT }}" --format="value(status.url)")
          curl -sf "$url/api/v1/runtime/environment" | tee /dev/stderr | grep -q '"is_mock":true'
